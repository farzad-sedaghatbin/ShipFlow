name: Docker Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject blog posts from private repo
        env:
          BLOG_TOKEN: ${{ secrets.BLOG_SYNC_TOKEN }}
        if: ${{ env.BLOG_TOKEN != '' }}
        run: |
          git clone https://${BLOG_TOKEN}@github.com/farzad-sedaghatbin/ShipFlow-blog.git /tmp/blog
          mkdir -p frontend/public/blog/posts
          cp /tmp/blog/posts/*.md frontend/public/blog/posts/ 2>/dev/null || true
          rm -rf /tmp/blog

          node -e "
          const fs = require('fs');
          const dir = 'frontend/public/blog/posts';
          const posts = fs.readdirSync(dir)
            .filter(f => f.endsWith('.md') && f.toLowerCase() !== 'readme.md')
            .map(f => {
              const content = fs.readFileSync(dir + '/' + f, 'utf8');
              const match = content.match(/^---[\s\S]*?date:\s*(\S+)[\s\S]*?---/);
              return { slug: f.replace('.md', ''), date: match ? match[1] : '1970-01-01' };
            })
            .sort((a, b) => b.date.localeCompare(a.date))
            .map(p => p.slug);
          fs.writeFileSync('frontend/public/blog/index.json', JSON.stringify(posts) + '\n');
          "

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/farzad-sedaghatbin/shipflow
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
