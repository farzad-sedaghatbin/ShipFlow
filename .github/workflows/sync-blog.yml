name: Sync Blog Posts from Private Repo

on:
  repository_dispatch:
    types: [blog-update]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ShipFlow main repo
        uses: actions/checkout@v4

      - name: Inject blog posts from private repo
        run: |
          git clone https://${{ secrets.BLOG_SYNC_TOKEN }}@github.com/farzad-sedaghatbin/ShipFlow-blog.git /tmp/blog
          mkdir -p frontend/public/blog/posts
          cp /tmp/blog/posts/*.md frontend/public/blog/posts/ 2>/dev/null || true
          rm -rf /tmp/blog

          # Rebuild index.json sorted newest-first by frontmatter date
          node -e "
          const fs = require('fs');
          const dir = 'frontend/public/blog/posts';
          const posts = fs.readdirSync(dir)
            .filter(f => f.endsWith('.md'))
            .map(f => {
              const content = fs.readFileSync(dir + '/' + f, 'utf8');
              const match = content.match(/^---[\s\S]*?date:\s*(\S+)[\s\S]*?---/);
              return { slug: f.replace('.md', ''), date: match ? match[1] : '1970-01-01' };
            })
            .sort((a, b) => b.date.localeCompare(a.date))
            .map(p => p.slug);
          fs.writeFileSync('frontend/public/blog/index.json', JSON.stringify(posts) + '\n');
          "

      - name: Deploy
        run: |
          echo "Blog posts injected. Ready for deployment."
          echo "Posts available:"
          cat frontend/public/blog/index.json
