name: Java CI with Maven & Node.js

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Spotless Check
      run: |
        cd backend
        ./mvnw spotless:check

    - name: Backend Tests
      run: |
        cd backend
        ./mvnw test

    - name: Frontend Install
      run: |
        cd frontend
        npm ci

    - name: Frontend Tests
      run: |
        cd frontend
        npm test -- --run
