name: Java CI with Maven & Node.js

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Spotless Check
      run: |
        cd backend
        ./mvnw spotless:check

    - name: Backend Tests
      run: |
        cd backend
        ./mvnw test

    - name: Frontend Install
      run: |
        cd frontend
        npm ci

    - name: Frontend Tests
      run: |
        cd frontend
        npm test -- --run

  docker-build-check:
    name: Docker build check (no push)
    runs-on: ubuntu-latest
    # Only run on PRs — publishing is handled by docker.yml on tag push
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/farzad-sedaghatbin/shipflow:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
