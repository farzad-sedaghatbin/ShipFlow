name: Java CI with Maven & Node.js

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Spotless Check
      run: |
        cd backend
        ./mvnw spotless:check

    - name: Backend Tests
      run: |
        cd backend
        ./mvnw test

    - name: Frontend Install
      run: |
        cd frontend
        npm install --no-audit

    - name: Frontend Tests
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: |
        cd frontend
        npm test -- --run

    - name: Docs Build
      continue-on-error: true
      run: |
        npm install --no-audit
        npm run docs:build

  e2e-tests:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only run on the canonical repo (forks won't have secrets / full infra)
    if: github.repository == 'farzad-sedaghatbin/shipflow'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shipflowdb
          POSTGRES_USER: shipflow
          POSTGRES_PASSWORD: shipflow_secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Start backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shipflowdb
          SPRING_DATASOURCE_USERNAME: shipflow
          SPRING_DATASOURCE_PASSWORD: shipflow_secret
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_DATA_REDIS_PASSWORD: ""
          APP_JWT_SECRET: ZTJlY2l0ZXN0LXNlY3JldC1taW5pbXVtLTMyLWNoYXJzLWxvbmcta2V5ISE=
          SPRING_PROFILES_ACTIVE: dev
        run: |
          cd backend
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev &
          echo "Waiting for backend to start..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break || sleep 5
          done
          curl -sf http://localhost:8080/actuator/health > /dev/null || {
            echo "Backend failed to become healthy" >&2
            exit 1
          }

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --no-audit

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install chromium --with-deps

      - name: Start frontend dev server
        run: |
          cd frontend
          npm run dev &
          echo "Waiting for frontend to start..."
          frontend_started=false
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000; then
              frontend_started=true
              break
            fi
            sleep 3
          done
          if [ "$frontend_started" != "true" ]; then
            echo "Frontend failed to start at http://localhost:3000" >&2
            exit 1
          fi

      - name: Run Playwright E2E tests
        run: |
          cd frontend
          npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build-check:
    name: Docker build check (no push)
    runs-on: ubuntu-latest
    # Only run on PRs — publishing is handled by docker.yml on tag push
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/farzad-sedaghatbin/shipflow:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
