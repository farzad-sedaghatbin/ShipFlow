version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: shipflow-db
    environment:
      POSTGRES_DB: shipflowdb
      POSTGRES_USER: shipflow
      POSTGRES_PASSWORD: shipflow_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipflow -d shipflowdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipflow-network

  # ShipFlow Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shipflow-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: shipflowdb
      DB_USERNAME: shipflow
      DB_PASSWORD: shipflow_secret
      # AI Provider Selection: 'ollama' (local), 'openai' (ChatGPT), or 'runpod' (cloud GPU)
      AI_PROVIDER: ${AI_PROVIDER:-runpod}
      AI_RISK_ENABLED: "true"
      # Ollama Configuration (local/self-hosted)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:instruct}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}
      # OpenAI Configuration (ChatGPT)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo-preview}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-120}
      # RunPod Configuration (cloud GPU)
      RUNPOD_BASE_URL: ${RUNPOD_BASE_URL:-https://api.runpod.ai/v2/your-endpoint-id}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_MODEL: ${RUNPOD_MODEL:-mistral:instruct}
      RUNPOD_TIMEOUT: ${RUNPOD_TIMEOUT:-180}
      RUNPOD_POLL_INTERVAL: ${RUNPOD_POLL_INTERVAL:-2}
      # JWT Secret (Base64-encoded, min 32 bytes)
      JWT_SECRET: ${JWT_SECRET:-c2hhcGV1cC10cmFja2VyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1zaWduaW5nLTI1Ni1iaXRz}
      # Q&A Feature Configuration
      QA_ENABLED: "true"
      QA_VECTORSTORE_PROVIDER: qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      QDRANT_API_KEY: ${QDRANT_API_KEY:-shipflow_qdrant_key}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - shipflow-network
    restart: unless-stopped

  # Qdrant Vector Database (Production Recommended)
  # High-performance vector database written in Rust
  # Features: filtering, clustering, sharding, snapshots, API key auth
  qdrant:
    image: qdrant/qdrant:latest
    container_name: shipflow-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-shipflow_qdrant_key}
      - QDRANT__SERVICE__ENABLE_TLS=false
      - QDRANT__LOG_LEVEL=INFO
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipflow-network
    restart: unless-stopped

  # ChromaDB (Alternative - uncomment if preferred over Qdrant)
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: shipflow-chromadb
  #   environment:
  #     - ANONYMIZED_TELEMETRY=FALSE
  #     - ALLOW_RESET=TRUE
  #     - IS_PERSISTENT=TRUE
  #     - PERSIST_DIRECTORY=/chroma/data
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - chromadb_data:/chroma/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - shipflow-network
  #   restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  # chromadb_data:  # Uncomment if using ChromaDB

networks:
  shipflow-network:
    driver: bridge
