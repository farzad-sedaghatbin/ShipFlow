version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: shipflow-db
    environment:
      POSTGRES_DB: shipflowdb
      POSTGRES_USER: shipflow
      POSTGRES_PASSWORD: shipflow_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipflow -d shipflowdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipflow-network

  # ShipFlow Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shipflow-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shipflowdb
      SPRING_DATASOURCE_USERNAME: shipflow
      SPRING_DATASOURCE_PASSWORD: shipflow_secret
      FLYWAY_REPAIR_ENABLED: "true"
      APP_SAMPLE_DATA_ENABLED: "true"
      # AI Provider Selection: 'ollama' (local), 'openai' (ChatGPT), or 'runpod' (cloud GPU)
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-openai}
      AI_RISK_ENABLED: "true"
      # Ollama Configuration (local/self-hosted)
      APP_AI_OLLAMA_BASE_URL: ${APP_AI_OLLAMA_BASE_URL:-http://localhost:11434}
      APP_AI_OLLAMA_MODEL: ${APP_AI_OLLAMA_MODEL:-mistral:instruct}
      APP_AI_OLLAMA_TIMEOUT: ${APP_AI_OLLAMA_TIMEOUT:-180}
      # OpenAI Configuration (ChatGPT)
      APP_AI_OPENAI_API_KEY: ${APP_AI_OPENAI_API_KEY:-}
      APP_AI_OPENAI_MODEL: ${APP_AI_OPENAI_MODEL:-gpt-4-turbo-preview}
      APP_AI_OPENAI_TIMEOUT: ${APP_AI_OPENAI_TIMEOUT:-120}
      # RunPod Configuration (cloud GPU)
      APP_AI_RUNPOD_BASE_URL: ${APP_AI_RUNPOD_BASE_URL:-https://api.runpod.ai/v2/your-endpoint-id}
      APP_AI_RUNPOD_API_KEY: ${APP_AI_RUNPOD_API_KEY:-}
      APP_AI_RUNPOD_MODEL: ${APP_AI_RUNPOD_MODEL:-mistral:instruct}
      APP_AI_RUNPOD_TIMEOUT: ${APP_AI_RUNPOD_TIMEOUT:-180}
      APP_AI_RUNPOD_POLL_INTERVAL: ${APP_AI_RUNPOD_POLL_INTERVAL:-2}
      # Redis Configuration
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Q&A Feature Configuration
      QA_ENABLED: "true"
      QA_VECTORSTORE_PROVIDER: qdrant
      # Force Qdrant even in dev profile (overrides application-dev.properties in-memory default)
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      QDRANT_API_KEY: ${QDRANT_API_KEY:-shipflow_qdrant_key}
      # MCP (Model Context Protocol) Configuration
      # GitHub MCP server for code context (set MCP_GITHUB_SERVER_URL to your MCP server)
      MCP_GITHUB_ENABLED: ${MCP_GITHUB_ENABLED:-false}
      MCP_GITHUB_SERVER_URL: ${MCP_GITHUB_SERVER_URL:-}
      MCP_GITHUB_TIMEOUT: ${MCP_GITHUB_TIMEOUT:-120}
      # Figma MCP server for design context (set MCP_FIGMA_SERVER_URL to your MCP server)
      MCP_FIGMA_ENABLED: ${MCP_FIGMA_ENABLED:-false}
      MCP_FIGMA_SERVER_URL: ${MCP_FIGMA_SERVER_URL:-}
      MCP_FIGMA_TIMEOUT: ${MCP_FIGMA_TIMEOUT:-120}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - shipflow-network
    restart: unless-stopped

  # Qdrant Vector Database (Production Recommended)
  # High-performance vector database written in Rust
  # Features: filtering, clustering, sharding, snapshots, API key auth
  qdrant:
    image: qdrant/qdrant:latest
    container_name: shipflow-qdrant
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-shipflow_qdrant_key}
      - QDRANT__SERVICE__ENABLE_TLS=false
      - QDRANT__LOG_LEVEL=INFO
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipflow-network
    restart: unless-stopped

  # Redis Cache (with RDB + AOF persistence)
  redis:
    image: redis:7-alpine
    container_name: shipflow-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shipflow-network
    restart: unless-stopped

  # ChromaDB (Alternative - uncomment if preferred over Qdrant)
  # chromadb:
  #   image: chromadb/chroma:latest
  #   container_name: shipflow-chromadb
  #   environment:
  #     - ANONYMIZED_TELEMETRY=FALSE
  #     - ALLOW_RESET=TRUE
  #     - IS_PERSISTENT=TRUE
  #     - PERSIST_DIRECTORY=/chroma/data
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - chromadb_data:/chroma/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - shipflow-network
  #   restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  # chromadb_data:  # Uncomment if using ChromaDB

networks:
  shipflow-network:
    driver: bridge
