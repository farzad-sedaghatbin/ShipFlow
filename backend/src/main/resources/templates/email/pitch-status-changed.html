<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: sans-serif; color: #1a1a2e; background: #f8f9fa; padding: 32px;">
  <div style="max-width: 560px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <h2 style="color: #7c3aed;">ShipFlow</h2>
    <p>Hi <span th:text="${recipientName}">User</span>,</p>
    <p>A pitch you follow has changed status:</p>
    <div style="background: #f3f4f6; border-radius: 6px; padding: 16px; margin: 16px 0;">
      <strong th:text="${entityTitle}">Pitch Title</strong>
      <span style="margin-left:8px;background:#7c3aed;color:#fff;padding:2px 10px;border-radius:12px;font-size:12px;" th:text="${newStatus}">STATUS</span>
    </div>
    <a th:href="${actionUrl}" style="display:inline-block;background:#7c3aed;color:#fff;padding:10px 24px;border-radius:6px;text-decoration:none;margin-top:8px;">View Pitch</a>
    <p style="margin-top:24px;font-size:12px;color:#6b7280;">You're receiving this because you use ShipFlow at <span th:text="${appBaseUrl}">shipflow.dev</span>.</p>
  </div>
</body>
</html>
