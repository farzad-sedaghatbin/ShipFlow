# English error messages

# HTTP Status errors
error.400=Bad request
error.401=Unauthorized
error.403=Forbidden
error.404=Not found
error.405=Method not allowed
error.409=Conflict
error.422=Validation failed
error.429=Too many requests
error.500=Internal server error
error.502=Bad gateway
error.503=Service unavailable

# Business errors
error.resource.not.found=The requested resource was not found
error.resource.already.exists=A resource with this identifier already exists
error.resource.in.use=Cannot delete resource because it is being used
error.invalid.operation=This operation is not allowed
error.invalid.state=Resource is in an invalid state for this operation
error.data.integrity=Data integrity violation
error.concurrent.modification=Resource was modified by another user
error.file.upload.failed=File upload failed
error.file.too.large=File size exceeds maximum allowed size
error.invalid.file.type=Invalid file type

