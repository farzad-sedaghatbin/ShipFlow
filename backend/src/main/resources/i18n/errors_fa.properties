# Persian (Farsi) error messages

# HTTP Status errors
error.400=درخواست نامعتبر
error.401=غیرمجاز
error.403=دسترسی ممنوع
error.404=یافت نشد
error.405=متد مجاز نیست
error.409=تداخل
error.422=اعتبارسنجی ناموفق
error.429=درخواست‌های بیش از حد
error.500=خطای داخلی سرور
error.502=درگاه نامعتبر
error.503=سرویس در دسترس نیست

# Business errors
error.resource.not.found=منبع درخواستی یافت نشد
error.resource.already.exists=منبعی با این شناسه از قبل وجود دارد
error.resource.in.use=امکان حذف منبع به دلیل استفاده وجود ندارد
error.invalid.operation=این عملیات مجاز نیست
error.invalid.state=منبع در وضعیت نامعتبر برای این عملیات است
error.data.integrity=نقض یکپارچگی داده
error.concurrent.modification=منبع توسط کاربر دیگری تغییر کرده است
error.file.upload.failed=آپلود فایل ناموفق بود
error.file.too.large=حجم فایل از حداکثر مجاز بیشتر است
error.invalid.file.type=نوع فایل نامعتبر است

# Additional business errors
error.cycle.overlap=تاریخ سیکل با سیکل موجود تداخل دارد
error.pitch.status.invalid=انتقال وضعیت نامعتبر برای این پیچ
error.pitch.no.team=امکان شروع پیچ بدون تیم تخصیص داده شده وجود ندارد
error.team.no.members=تیم باید حداقل یک عضو داشته باشد
error.task.circular.dependency=وابستگی دوری شناسایی شد
error.hill.chart.position.invalid=موقعیت نمودار تپه باید بین ۰ و ۱۰۰ باشد
error.bet.invalid.amount=مقدار شرط‌بندی نامعتبر است
error.retro.already.completed=بازنگری قبلاً تکمیل شده است
error.meeting.conflict=زمان جلسه با جلسه دیگری تداخل دارد
