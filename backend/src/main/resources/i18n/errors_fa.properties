# Persian (Farsi) error messages

# HTTP Status errors
error.400=درخواست نامعتبر
error.401=غیرمجاز
error.403=دسترسی ممنوع
error.404=یافت نشد
error.405=متد مجاز نیست
error.409=تداخل
