# English validation messages

# Common validations
validation.required=This field is required
validation.min.length=Must be at least {min} characters
validation.max.length=Must be at most {max} characters
validation.email=Please enter a valid email address
validation.url=Please enter a valid URL
validation.number=Please enter a valid number
validation.positive=Must be a positive number
validation.range=Value must be between {min} and {max}

# Field-specific validations
validation.username.required=Username is required
validation.username.length=Username must be between 3 and 50 characters
validation.password.required=Password is required
validation.password.length=Password must be at least 8 characters
validation.email.required=Email is required
validation.email.format=Please enter a valid email address
validation.name.required=Name is required
validation.name.length=Name must be between 1 and 255 characters
validation.description.length=Description must be at most 1000 characters
validation.key.format=Key must contain only uppercase letters and numbers
validation.date.required=Date is required
validation.date.future=Date must be in the future
validation.date.past=Date must be in the past
