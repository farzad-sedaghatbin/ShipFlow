# Application name
spring.application.name=shipflow

# Logging Configuration
# Suppress HTTP protocol mismatch errors (HTTPS requests to HTTP endpoint)
logging.level.org.apache.coyote.http11.Http11Processor=ERROR

# Server configuration
server.port=8080

# Security: Disable ForwardedHeaderFilter to prevent Log4Shell and JNDI injection attacks
# We use a custom MaliciousHeaderFilter instead for better security control
server.forward-headers-strategy=none
# Keep Tomcat remote IP configuration for legitimate use cases
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1|::1|10\\..*|192\\.168\\..*

# CORS allowed origins (default for all profiles, can be overridden)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://shipflow.dev,https://www.shipflow.dev,http://localhost:*,http://127.0.0.1:*}

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
# Base64 encoded secret key (change in production!)
app.jwt.secret=c2hhcGV1cC10cmFja2VyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1zaWduaW5nLTI1Ni1iaXRz
# Token expiration: 24 hours in milliseconds
app.jwt.expiration-ms=86400000

# AI Risk Analysis Configuration
# Feature flag to enable/disable AI risk analysis (default: true)
app.ai.risk-analysis.enabled=${AI_RISK_ENABLED:true}

# AI Response Caching Configuration
# Master switch to enable/disable all AI caching
app.ai.cache.enabled=${AI_CACHE_ENABLED:true}
# Cache provider: in-memory (default) or redis
app.ai.cache.provider=${AI_CACHE_PROVIDER:in-memory}
# Redis configuration (only used when provider=redis)
app.ai.cache.redis.host=${AI_CACHE_REDIS_HOST:localhost}
app.ai.cache.redis.port=${AI_CACHE_REDIS_PORT:6379}
app.ai.cache.redis.password=${AI_CACHE_REDIS_PASSWORD:}
app.ai.cache.redis.database=${AI_CACHE_REDIS_DATABASE:0}
# Risk analysis cache settings
app.ai.cache.risk.enabled=${AI_CACHE_RISK_ENABLED:true}
# TTL: 0 = infinite (until data changes or server restart), >0 = minutes
# Since we have change detection, 0 is recommended for dev (server lifetime)
app.ai.cache.risk.pitch-ttl-minutes=${AI_CACHE_RISK_PITCH_TTL:0}
app.ai.cache.risk.cycle-ttl-minutes=${AI_CACHE_RISK_CYCLE_TTL:0}
app.ai.cache.risk.invalidate-on-data-change=${AI_CACHE_RISK_INVALIDATE:true}
# Q&A response cache settings
app.ai.cache.qa.enabled=${AI_CACHE_QA_ENABLED:true}
# TTL in hours: 0 = infinite, >0 = hours (2-3 hours recommended for Q&A)
app.ai.cache.qa.ttl-hours=${AI_CACHE_QA_TTL_HOURS:3}
app.ai.cache.qa.similarity-threshold=${AI_CACHE_QA_SIMILARITY:0.85}
app.ai.cache.qa.max-entries-per-context=${AI_CACHE_QA_MAX_ENTRIES:100}

# AI Provider Selection: 'runpod' (cloud GPU) or 'ollama' (local/self-hosted)
# Default: runpod - uses RunPod Serverless GPU for production
# Use 'ollama' for local development or self-hosted deployments
app.ai.provider=${AI_PROVIDER:runpod}

# RunPod Serverless GPU Configuration (default provider)
app.ai.runpod.base-url=${RUNPOD_BASE_URL:https://api.runpod.ai/v2/til9f1og9eagf8}
app.ai.runpod.api-key=${RUNPOD_API_KEY:rpa_Z412FZ9NVWZGRPFD3QP2TF1PV3Z0ULZQGR158BHC1wbulf}
app.ai.runpod.model=${RUNPOD_MODEL:mistral:instruct}
app.ai.runpod.timeout=${RUNPOD_TIMEOUT:180}
app.ai.runpod.poll-interval=${RUNPOD_POLL_INTERVAL:2}

# Ollama Configuration (for local/self-hosted deployments)
# Set AI_PROVIDER=ollama to use this configuration
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:mistral:instruct}
app.ai.ollama.timeout=${OLLAMA_TIMEOUT:180}

# AI Q&A Feature Configuration
# Feature flag to enable/disable AI Q&A feature (default: false in production)
app.features.qa.enabled=${QA_ENABLED:true}
# Embedding model (all-MiniLM-L6-v2 from HuggingFace)
app.qa.embedding.model=${QA_EMBEDDING_MODEL:sentence-transformers/all-MiniLM-L6-v2}
# Vector store type: in-memory (dev) or chromadb (prod)
app.qa.vector-store.type=${QA_VECTOR_STORE_TYPE:in-memory}
# ChromaDB URL (for production)
app.qa.chromadb.url=${CHROMADB_URL:http://localhost:8000}
# ChromaDB collection name
app.qa.chromadb.collection=${CHROMADB_COLLECTION:shipflow_knowledge}
# Maximum number of results for similarity search
app.qa.retrieval.top-k=${QA_TOP_K:5}
# Chunk size for text splitting (max tokens)
app.qa.chunking.max-tokens=${QA_CHUNK_SIZE:512}
# Overlap between chunks
app.qa.chunking.overlap=${QA_CHUNK_OVERLAP:50}

# QA Test Management Feature Configuration
# Feature flag to enable/disable QA test management features (test cases, bug reports, test runs)
app.qa.test-management.enabled=${QA_TEST_MANAGEMENT_ENABLED:true}

# AI Q&A Advanced Features (Phase 3 - 10/10 Score)
# LLM Response Caching Configuration
app.qa.llm-cache.enabled=${QA_LLM_CACHE_ENABLED:true}
app.qa.llm-cache.ttl-minutes=${QA_LLM_CACHE_TTL:60}
app.qa.llm-cache.max-size=${QA_LLM_CACHE_MAX_SIZE:1000}

# Prompt Compression Configuration
app.qa.prompt-compression.enabled=${QA_PROMPT_COMPRESSION_ENABLED:true}
app.qa.prompt-compression.target-tokens=${QA_COMPRESSION_TARGET_TOKENS:3000}

# Query Decomposition Configuration
app.qa.query-decomposition.enabled=${QA_QUERY_DECOMPOSITION_ENABLED:true}

# Content Guardrails Configuration
app.qa.guardrails.enabled=${QA_GUARDRAILS_ENABLED:true}
app.qa.guardrails.min-safety-score=${QA_GUARDRAILS_MIN_SCORE:50}

# Active Learning Configuration
app.qa.active-learning.enabled=${QA_ACTIVE_LEARNING_ENABLED:true}
app.qa.active-learning.feedback-threshold=${QA_ACTIVE_LEARNING_THRESHOLD:0.5}
# Enable AI-assisted test case generation
app.qa.ai-test-generation.enabled=${QA_AI_TEST_GENERATION_ENABLED:true}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:10MB}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size=${UPLOAD_MAX_SIZE:10485760}
