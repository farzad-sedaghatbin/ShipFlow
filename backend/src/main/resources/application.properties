# Application name
spring.application.name=shipflow

# Logging Configuration
# Suppress HTTP protocol mismatch errors (HTTPS requests to HTTP endpoint)
logging.level.org.apache.coyote.http11.Http11Processor=ERROR
# Reduce noise from client disconnection exceptions
logging.level.com.github.farzadsedaghatbin.shipflow.exception.GlobalExceptionHandler=INFO
# Enable INFO logging for Teams integration debugging
logging.level.com.github.farzadsedaghatbin.shipflow.service.teams.TeamsIntegrationService=INFO
# Suppress Tomcat client disconnection warnings  
logging.level.org.apache.catalina.connector=WARN
logging.level.org.apache.coyote=WARN

# Server configuration
server.port=8080

# Tomcat Thread Pool Configuration
# Increased to handle load when some threads are busy with AI calls
# AI calls are executed on a dedicated thread pool (aiTaskExecutor), but
# we keep extra capacity here for non-AI requests
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=25
server.tomcat.accept-count=100

# Security: Disable ForwardedHeaderFilter to prevent Log4Shell and JNDI injection attacks
# We use a custom MaliciousHeaderFilter instead for better security control
server.forward-headers-strategy=none
# Keep Tomcat remote IP configuration for legitimate use cases
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1|::1|10\\..*|192\\.168\\..*

# CORS allowed origins (default for all profiles, can be overridden)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://shipflow.dev,https://www.shipflow.dev,http://localhost:*,http://127.0.0.1:*}

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Jackson JSON Configuration
# Ensure all dates are serialized in ISO-8601 format (UTC)
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.default-property-inclusion=non_null

# Timezone - All server dates in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Ignore missing migrations (seed data moved to db/seed in v0.3.3)
spring.flyway.ignore-missing-migrations=true
# Allow out-of-order migrations (for hotfix branches)
spring.flyway.out-of-order=true
# Flyway repair on startup (only enable when needed after failed migrations)
spring.flyway.repair.enabled=${FLYWAY_REPAIR_ENABLED:false}

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
# Base64 encoded secret key (change in production!)
app.jwt.secret=c2hhcGV1cC10cmFja2VyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1zaWduaW5nLTI1Ni1iaXRz
# Token expiration: 24 hours in milliseconds
app.jwt.expiration-ms=86400000

# AI Risk Analysis Configuration
# Feature flag to enable/disable AI risk analysis (default: true)
app.ai.risk-analysis.enabled=${AI_RISK_ENABLED:true}

# ====================================
# Redis Configuration (Spring Data Redis)
# ====================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:changeme}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.timeout=2000ms

# Spring Cache (backed by Redis)
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.enable-statistics=true
spring.cache.redis.key-prefix=shipflow:
spring.cache.cache-names=risks,qa,users,permissions,projects,cycles,teams,tags,persons,roadmap

# AI Response Caching Configuration
# Master switch to enable/disable all AI caching
app.ai.cache.enabled=${AI_CACHE_ENABLED:true}
# Cache provider: redis (default) or in-memory
app.ai.cache.provider=${AI_CACHE_PROVIDER:redis}
# Redis configuration (delegates to spring.data.redis.* above)
app.ai.cache.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
app.ai.cache.redis.port=${SPRING_DATA_REDIS_PORT:6379}
app.ai.cache.redis.password=${SPRING_DATA_REDIS_PASSWORD:changeme}
app.ai.cache.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
# Risk analysis cache settings
app.ai.cache.risk.enabled=${AI_CACHE_RISK_ENABLED:true}
# TTL: 0 = infinite (until data changes or server restart), >0 = minutes
# Since we have change detection, 0 is recommended for dev (server lifetime)
app.ai.cache.risk.pitch-ttl-minutes=${AI_CACHE_RISK_PITCH_TTL:1440}
app.ai.cache.risk.cycle-ttl-minutes=${AI_CACHE_RISK_CYCLE_TTL:1440}
app.ai.cache.risk.invalidate-on-data-change=${AI_CACHE_RISK_INVALIDATE:true}
# Q&A response cache settings
app.ai.cache.qa.enabled=${AI_CACHE_QA_ENABLED:true}
# TTL in hours: 0 = infinite, >0 = hours (2-3 hours recommended for Q&A)
app.ai.cache.qa.ttl-hours=${AI_CACHE_QA_TTL_HOURS:3}
app.ai.cache.qa.similarity-threshold=${AI_CACHE_QA_SIMILARITY:0.90}
app.ai.cache.qa.max-entries-per-context=${AI_CACHE_QA_MAX_ENTRIES:100}

# ====================================
# AI Provider Configuration (Pluggable LLM System)
# ====================================
# Supported providers: ollama, runpod, openai, anthropic (future), google (future)
# Default: ollama - for local development
# Set AI_PROVIDER environment variable to switch providers
app.ai.provider=${AI_PROVIDER:ollama}

# Common AI settings (apply to all providers)
app.ai.temperature=${AI_TEMPERATURE:0.3}
app.ai.max-tokens=${AI_MAX_TOKENS:2048}

# ---- Ollama Configuration (local/self-hosted) ----
# Best for: Local development, self-hosted deployments, privacy-first environments
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.ollama.model=${OLLAMA_MODEL:mistral:instruct}
app.ai.ollama.timeout=${OLLAMA_TIMEOUT:180}

# ---- RunPod Configuration (cloud GPU) ----
# Best for: Production without local GPU, pay-per-use scaling
app.ai.runpod.base-url=${RUNPOD_BASE_URL:https://api.runpod.ai}
app.ai.runpod.api-key=${RUNPOD_API_KEY:}
app.ai.runpod.model=${RUNPOD_MODEL:mistral:instruct}
app.ai.runpod.timeout=${RUNPOD_TIMEOUT:180}
app.ai.runpod.poll-interval=${RUNPOD_POLL_INTERVAL:2}

# ---- OpenAI Configuration (ChatGPT) ----
# Best for: High-quality responses, complex reasoning, production use
# Models: gpt-4o, gpt-4o-mini (default), gpt-4-turbo, gpt-3.5-turbo
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.base-url=${OPENAI_BASE_URL:}
app.ai.openai.timeout=${OPENAI_TIMEOUT:120}
app.ai.openai.organization-id=${OPENAI_ORG_ID:}

# ---- Anthropic Configuration (Claude) - Future ----
# app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
# app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-3-sonnet-20240229}

# ---- Google Configuration (Gemini) - Future ----
# app.ai.google.api-key=${GOOGLE_API_KEY:}
# app.ai.google.model=${GOOGLE_MODEL:gemini-pro}

# AI Q&A Feature Configuration
# Feature flag to enable/disable AI Q&A feature (default: false in production)
app.features.qa.enabled=${QA_ENABLED:true}
# Embedding model (all-MiniLM-L6-v2 from HuggingFace)
app.qa.embedding.model=${QA_EMBEDDING_MODEL:sentence-transformers/all-MiniLM-L6-v2}

# ====================================
# Vector Store Configuration (Pluggable System)
# ====================================
# Supported providers: in-memory, qdrant, chroma, milvus (future), pinecone (future), weaviate (future)
# Default: in-memory for development, qdrant recommended for production
app.qa.vectorstore.provider=${QA_VECTORSTORE_PROVIDER:in-memory}

# Common vector store settings
app.qa.vectorstore.collection=${QA_VECTORSTORE_COLLECTION:shipflow_knowledge}
app.qa.vectorstore.dimension=${QA_VECTORSTORE_DIMENSION:384}

# ---- Qdrant Configuration (Production Recommended) ----
# High-performance vector database written in Rust
# Features: filtering, clustering, sharding, snapshots
app.qa.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
app.qa.vectorstore.qdrant.port=${QDRANT_PORT:6334}
app.qa.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}
app.qa.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:false}

# ---- ChromaDB Configuration (Alternative) ----
# Simpler setup, good for smaller deployments
app.qa.vectorstore.chroma.url=${CHROMADB_URL:http://localhost:8000}

# ---- Milvus Configuration (Future - Large Scale) ----
# app.qa.vectorstore.milvus.host=${MILVUS_HOST:localhost}
# app.qa.vectorstore.milvus.port=${MILVUS_PORT:19530}

# ---- Pinecone Configuration (Future - Managed Cloud) ----
# app.qa.vectorstore.pinecone.api-key=${PINECONE_API_KEY:}
# app.qa.vectorstore.pinecone.environment=${PINECONE_ENVIRONMENT:}
# app.qa.vectorstore.pinecone.index=${PINECONE_INDEX:shipflow}

# Q&A Retrieval Settings
# Maximum number of results for similarity search
app.qa.retrieval.top-k=${QA_TOP_K:5}
# Chunk size for text splitting (max tokens)
app.qa.chunking.max-tokens=${QA_CHUNK_SIZE:512}
# Overlap between chunks
app.qa.chunking.overlap=${QA_CHUNK_OVERLAP:50}

# QA Test Management Feature Configuration
# Feature flag to enable/disable QA test management features (test cases, bug reports, test runs)
app.qa.test-management.enabled=${QA_TEST_MANAGEMENT_ENABLED:true}

# AI Q&A Advanced Features (Phase 3 - 10/10 Score)
# LLM Response Caching Configuration
app.qa.llm-cache.enabled=${QA_LLM_CACHE_ENABLED:true}
app.qa.llm-cache.ttl-minutes=${QA_LLM_CACHE_TTL:60}
app.qa.llm-cache.max-size=${QA_LLM_CACHE_MAX_SIZE:1000}

# Prompt Compression Configuration
app.qa.prompt-compression.enabled=${QA_PROMPT_COMPRESSION_ENABLED:true}
app.qa.prompt-compression.target-tokens=${QA_COMPRESSION_TARGET_TOKENS:3000}

# Query Decomposition Configuration
app.qa.query-decomposition.enabled=${QA_QUERY_DECOMPOSITION_ENABLED:true}

# Content Guardrails Configuration
app.qa.guardrails.enabled=${QA_GUARDRAILS_ENABLED:true}
app.qa.guardrails.min-safety-score=${QA_GUARDRAILS_MIN_SCORE:50}

# Active Learning Configuration
app.qa.active-learning.enabled=${QA_ACTIVE_LEARNING_ENABLED:true}
app.qa.active-learning.feedback-threshold=${QA_ACTIVE_LEARNING_THRESHOLD:0.5}
# Enable AI-assisted test case generation
app.qa.ai-test-generation.enabled=${QA_AI_TEST_GENERATION_ENABLED:true}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:10MB}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size=${UPLOAD_MAX_SIZE:10485760}

# GitHub Integration Configuration
# Enable/disable GitHub integration feature
app.github.enabled=${GITHUB_ENABLED:true}
# Default webhook URL (can be overridden per repository)
app.github.webhook-url=${GITHUB_WEBHOOK_URL:}
# Global webhook secret (recommended to set per repository instead)
app.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
# GitHub OAuth App credentials (for private repository access)
app.github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
app.github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
# Auto-link commits/PRs to tasks when keywords are detected
app.github.auto-link.enabled=${GITHUB_AUTO_LINK_ENABLED:true}
# Auto-close tasks when PR is merged with "closes #123" keywords
app.github.auto-close-tasks.enabled=${GITHUB_AUTO_CLOSE_TASKS_ENABLED:true}

# ====================================
# GitHub App Configuration (Organization-Wide Access)
# ====================================
# For organizations with 50+ repositories, use GitHub App installation instead of
# adding repositories one by one. This provides:
# - Single authorization grants access to ALL organization repositories
# - Automatic webhook configuration for all repositories
# - New repositories automatically accessible (if "all" is selected during install)
# - No need to configure each repository individually
#
# To set up a GitHub App:
# 1. Go to GitHub → Settings → Developer settings → GitHub Apps
# 2. Create a new GitHub App with these permissions:
#    - Repository contents: Read
#    - Pull requests: Read & Write
#    - Issues: Read & Write (optional)
#    - Webhooks: Read & Write
# 3. Subscribe to events: push, pull_request, create, delete
# 4. Generate and download private key
# 5. Set the values below

# GitHub App ID (numeric ID from app settings)
app.github.app.id=${GITHUB_APP_ID:}
# GitHub App name (slug from app URL: github.com/apps/{app-name})
app.github.app.name=${GITHUB_APP_NAME:shipflow}
# GitHub App private key (PEM format, can be file path or base64 encoded)
app.github.app.private-key=${GITHUB_APP_PRIVATE_KEY:}
# GitHub App client ID (for OAuth web flow)
app.github.app.client-id=${GITHUB_APP_CLIENT_ID:}
# GitHub App client secret (for OAuth web flow)
app.github.app.client-secret=${GITHUB_APP_CLIENT_SECRET:}
# GitHub App webhook secret (shared secret for webhook verification)
app.github.app.webhook-secret=${GITHUB_APP_WEBHOOK_SECRET:}

# Base URL for OAuth callbacks (OPTIONAL - auto-detected from request if not set)
# Only needed if auto-detection fails (e.g., complex proxy setups)
# Example: https://shipflow.mycompany.com
app.base-url=${APP_BASE_URL:}

# ====================================
# MCP (Model Context Protocol) Configuration
# ====================================
# MCP servers provide code and design context for AI features like Wise Architecture.
# See MCP_SETUP_GUIDE.md for detailed setup instructions.

# ---- GitHub MCP Server ----
# Provides code context from GitHub repositories
# Enable GitHub MCP integration
app.mcp.github.enabled=${MCP_GITHUB_ENABLED:false}
# GitHub MCP server URL (e.g., http://localhost:3100 for local, or your hosted server)
app.mcp.github.server-url=${MCP_GITHUB_SERVER_URL:}
# Connection timeout in seconds
app.mcp.github.timeout-seconds=${MCP_GITHUB_TIMEOUT:30}

# ---- Figma MCP Server ----
# Provides design context from Figma files
# Enable Figma MCP integration
app.mcp.figma.enabled=${MCP_FIGMA_ENABLED:false}
# Figma MCP server URL (e.g., http://localhost:3101 for local, or your hosted server)
app.mcp.figma.server-url=${MCP_FIGMA_SERVER_URL:}
# Connection timeout in seconds
app.mcp.figma.timeout-seconds=${MCP_FIGMA_TIMEOUT:30}

# ====================================
# Inbound Webhook Providers
# ====================================
# Generic, vendor-agnostic inbound webhook infrastructure.
# Any external service can push events to: POST /api/inbound/{provider}
# Providers are auto-discovered Spring @Components implementing InboundWebhookHandler.
# Each provider manages its own configuration (secrets, project mappings, etc.)
# via @Value-injected properties following the pattern: app.inbound.{provider}.*
#
# To add a new provider:
#   1. Implement InboundWebhookHandler as a Spring @Component
#   2. Add app.inbound.{provider}.* properties below
#   3. Restart — the router auto-discovers the new handler
#
# Example provider config (uncomment and adapt for your provider):
# app.inbound.example.enabled=${EXAMPLE_INBOUND_ENABLED:false}
# app.inbound.example.webhook-secret=${EXAMPLE_WEBHOOK_SECRET:}
