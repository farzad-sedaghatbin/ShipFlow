# PostgreSQL Database Configuration for Development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shipflowdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shipflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shipflow_secret}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway - DO NOT clean database in dev (preserve data between restarts)
spring.flyway.clean-disabled=true
# Disable validation in dev to tolerate checksum drift from local migration edits.
# CI always runs with validation enabled (default). Safe here because the dev DB
# is local-only (not used for CI/prod); migrations are re-validated before any prod/CI deployment.
spring.flyway.validate-on-migrate=false
# Dev uses SampleDataInitializer.java for seeding, not Flyway SQL scripts
spring.flyway.locations=classpath:db/migration

# Initialize sample data
app.sample-data.enabled=true
# Local dev keeps the Scrum demo project (see ScrumDemoInitializer).
app.scrum-demo.auto-create=true

# Redis / Cache - uses the Redis container from docker-compose
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:changeme}
spring.cache.type=redis
app.ai.cache.provider=redis

# AI features - local dev uses Ollama (no API key needed); set AI_PROVIDER env var to override
app.features.qa.enabled=true
app.ai.risk-analysis.enabled=true
app.ai.provider=ollama

# Vector Store - use in-memory for local dev to avoid needing Qdrant auth config
app.qa.vectorstore.provider=${QA_VECTORSTORE_PROVIDER:in-memory}

# Rate limiting - relax auth limit in dev/test so E2E suites can re-login many
# times from the same runner IP without hitting the 10 req/min production guard.
app.rate-limit.auth.capacity=60
