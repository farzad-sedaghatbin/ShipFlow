# PostgreSQL Database Configuration for Development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shipflowdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shipflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shipflow_secret}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway - DO NOT clean database in dev (preserve data between restarts)
spring.flyway.clean-disabled=true
# Include seed data migrations in dev environment
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Initialize sample data
app.sample-data.enabled=true

# Redis / Cache - uses the Redis container from docker-compose
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.cache.type=redis
app.ai.cache.provider=redis

# AI features - use RunPod with API keys from .env file
app.features.qa.enabled=true
app.ai.risk-analysis.enabled=true
app.ai.provider=openai

# Vector Store - uses env var QA_VECTORSTORE_PROVIDER (set to 'qdrant' in docker-compose)
# Falls back to 'qdrant' so docker-compose always uses Qdrant; override locally if needed
app.qa.vectorstore.provider=${QA_VECTORSTORE_PROVIDER:qdrant}
