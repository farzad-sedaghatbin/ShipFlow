# H2 Database Configuration for Development
spring.datasource.url=jdbc:h2:file:./target/shipflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway - clean and migrate for dev (allows migration changes)
spring.flyway.clean-disabled=false

# Initialize sample data
app.sample-data.enabled=true

# AI features - enabled to use RunPod from .env
app.features.qa.enabled=true
app.ai.risk-analysis.enabled=true
app.qa.vector-store.type=in-memory
