# PostgreSQL Database Configuration for Development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shipflowdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shipflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shipflow_secret}

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway - DO NOT clean database in dev (preserve data between restarts)
spring.flyway.clean-disabled=true
# Include seed data migrations in dev environment
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Initialize sample data
app.sample-data.enabled=true

# AI features - use RunPod with API keys from .env file
app.features.qa.enabled=true
app.ai.risk-analysis.enabled=true
app.ai.provider=runpod

# Vector Store - use in-memory for development (no external dependencies)
app.qa.vectorstore.provider=in-memory
