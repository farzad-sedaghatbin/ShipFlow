# PostgreSQL Configuration for Production
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shipflowdb}
spring.datasource.username=${DB_USERNAME:shipflow}
spring.datasource.password=${DB_PASSWORD:shipflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Disable sample data in production
app.sample-data.enabled=false

# Q&A Feature - disabled by default, use environment variable to enable
app.features.qa.enabled=${QA_ENABLED:false}
app.qa.vector-store.type=${QA_VECTOR_STORE_TYPE:chromadb}
app.qa.chromadb.host=${CHROMADB_HOST:localhost}
app.qa.chromadb.port=${CHROMADB_PORT:8000}
app.qa.chromadb.collection=${CHROMADB_COLLECTION:shipflow_knowledge}
