# PostgreSQL Configuration for Production
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shipflowdb}
spring.datasource.username=${DB_USERNAME:shipflow}
spring.datasource.password=${DB_PASSWORD:shipflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
# Ensure connections are reset after each use to clear read-only state
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-init-sql=SET SESSION CHARACTERISTICS AS TRANSACTION READ WRITE

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway - Only run schema migrations in production (NO seed data)
spring.flyway.locations=classpath:db/migration
# Ignore missing migrations (seed data moved to db/seed)
spring.flyway.ignore-missing-migrations=true

# Disable sample data in production
app.sample-data.enabled=false

# Redis Cache (production - env vars injected by docker-compose)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:changeme}
spring.cache.type=redis
app.ai.cache.provider=redis

# Q&A Feature - disabled by default, use environment variable to enable
app.features.qa.enabled=${QA_ENABLED:false}

# Vector Store - Qdrant (Production Recommended)
# Qdrant is a high-performance vector database with filtering, clustering, and enterprise features
app.qa.vectorstore.provider=${QA_VECTORSTORE_PROVIDER:qdrant}
app.qa.vectorstore.collection=${QA_VECTORSTORE_COLLECTION:shipflow_knowledge}
app.qa.vectorstore.dimension=${QA_VECTORSTORE_DIMENSION:384}

# Qdrant Connection Settings
app.qa.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
app.qa.vectorstore.qdrant.port=${QDRANT_PORT:6334}
app.qa.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}
app.qa.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:false}

# CORS Configuration for Production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://shipflow.dev,https://www.shipflow.dev}
