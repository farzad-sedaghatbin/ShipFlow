# Test Profile Configuration

# H2 Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (use JPA auto-ddl)
spring.flyway.enabled=false

# Disable auto-creation of admin user during tests
app.admin.auto-create=false

# Q&A Feature - Enabled for tests with in-memory store
app.features.qa.enabled=true
app.qa.vector-store.type=in-memory
app.qa.retrieval.top-k=5
app.qa.chunking.size=1000
app.qa.chunking.overlap=200

# Logging
logging.level.org.springframework=WARN
logging.level.com.github.farzadsedaghatbin=DEBUG

# AI Configuration - RunPod (with defaults for tests)
app.ai.provider=${AI_PROVIDER:runpod}
app.ai.runpod.base-url=${RUNPOD_BASE_URL:https://api.runpod.ai/v2/til9f1og9eagf8}
app.ai.runpod.api-key=${RUNPOD_API_KEY:rpa_Z412FZ9NVWZGRPFD3QP2TF1PV3Z0ULZQGR158BHC1wbulf}
app.ai.runpod.model=${RUNPOD_MODEL:mistral:instruct}
app.ai.runpod.timeout=${RUNPOD_TIMEOUT:180}
app.ai.runpod.poll-interval=${RUNPOD_POLL_INTERVAL:2}
