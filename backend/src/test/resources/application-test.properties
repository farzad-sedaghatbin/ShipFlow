# Test Profile Configuration

# H2 Database for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Hibernate Envers Configuration for Tests
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_AUD
spring.jpa.properties.org.hibernate.envers.revision_field_name=REV
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=REVTYPE
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Disable Flyway for tests (use JPA auto-ddl)
spring.flyway.enabled=false

# Disable RBAC permission aspect in test mode
# (permissions table doesn't exist without Flyway)
app.security.rbac.enabled=false

# Disable Spring Security for controller tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

# Disable auto-creation of admin user during tests
app.admin.auto-create=false

# Enable AI features for tests (required for services that depend on AICacheService)
app.ai.risk-analysis.enabled=true
app.ai.cache.provider=in-memory

# Cache - use simple in-memory (no Redis in CI/test environment)
spring.cache.type=simple

# Q&A Feature - Enabled for tests with in-memory store
app.features.qa.enabled=true
app.qa.vector-store.type=in-memory
app.qa.retrieval.top-k=5
app.qa.chunking.size=1000
app.qa.chunking.overlap=200

# Logging
logging.level.org.springframework=WARN
logging.level.com.github.farzadsedaghatbin=DEBUG

# File Upload
app.upload.dir=${java.io.tmpdir}/test-uploads
app.upload.max-size=10485760

# AI Configuration - RunPod (mock values for tests)
app.ai.provider=${AI_PROVIDER:runpod}
app.ai.runpod.base-url=${RUNPOD_BASE_URL:http://localhost:8080/mock}
app.ai.runpod.api-key=${RUNPOD_API_KEY:test-key-not-real}
app.ai.runpod.model=${RUNPOD_MODEL:mistral:instruct}
app.ai.runpod.timeout=${RUNPOD_TIMEOUT:180}
app.ai.runpod.poll-interval=${RUNPOD_POLL_INTERVAL:2}
spring.jpa.open-in-view=false
